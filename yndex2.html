<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste pra ver se consigo fazer um contador sem ref</title>
    <style>
    body {
        text-align: center;
    background-color: aqua;
    margin-top: 50px
    }


h1 {
  font-size: 90px;
  margin-bottom: 32px;
  font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}
button {

color: red;
font-size: 22px;
font-family: 'Courier New', Courier, monospace;
}





    </style>
</head>
<body>
    <section> <h1>0</h1>
<button onclick="adicionar()">mais</button>
<button onclick="zerar()">zerar</button>
<button onclick="menos()">menos</button>
</section>
<script>

let numero = 0

function adicionar() {

numero ++;
document.querySelector ('h1') . textContent = numero
    
}

function menos() {


numero --;
document.querySelector ('h1') . textContent = numero

}

function zerar() {

    numero = 0
    document.querySelector ('h1') . textContent = numero
    
}

</script>
    
</body>
</html>
